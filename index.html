<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Conferência de Carga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--ink:#f5f5f5;--mut:#a3a3a3;--line:#333;--y:#ffc400;--ok:#1b8a4b;--bad:#d32f2f;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{background:#000;border-bottom:4px solid var(--y);padding:12px 14px}
.wm{font:700 30px/1 'Barlow Condensed',sans-serif;letter-spacing:1.5px;color:var(--y)}
.wm b{color:#fff}
header small{display:block;color:var(--mut);margin-top:3px}
main{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:#0d0d0d;color:var(--ink);font:inherit}
#man{border:2px solid var(--y);font-size:18px}
button{font:600 16px Barlow,sans-serif;padding:12px 14px;border-radius:6px;border:1px solid #555;background:#262626;color:var(--ink);cursor:pointer}
button.p{background:var(--y);color:#000;border-color:var(--y)}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:1px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
#cnt{font:700 96px/1 'Barlow Condensed',sans-serif;text-align:center;color:var(--y);font-variant-numeric:tabular-nums}
#lbl{text-align:center;color:var(--mut)}
#msg{margin-top:8px;padding:10px;border-radius:6px;text-align:center;font-weight:600;background:#0d0d0d;color:var(--mut);min-height:42px;overflow-wrap:anywhere}
#msg.ok{background:var(--ok);color:#fff}#msg.bad{background:var(--bad);color:#fff}
ul{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow-y:auto}
li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
li span:first-child{overflow-wrap:anywhere}li span:last-child{color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);padding:8px 0}
.sb{position:relative;margin-top:12px}
.sb svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.sb input{padding-left:40px;padding-right:44px}
#bx{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 12px;font-size:22px;line-height:1;background:transparent;border:0;display:none}
#lh{color:var(--mut);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header><div class="wm">TORK <b>TOOLS</b></div><small>Conferência de carga</small></header>
<main>
<div class="card"><input id="carga" placeholder="Caminhão / placa / transportadora" aria-label="Identificação da carga"></div>

<div class="card" id="cntcard">
  <div id="cnt">0</div>
  <div id="lbl">pedidos no caminhão</div>
</div>

<div class="card">
  <input id="man" placeholder="Bipe a etiqueta aqui" aria-label="Leitura do leitor" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="row">
    <button class="p" id="btnAdd">Adicionar</button>
    <button id="btnKb">Teclado</button>
    <button id="btnUndo">Desfazer</button>
  </div>
  <div id="msg">Pronto: bipe a etiqueta com o leitor.</div>
  <div class="sb">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="busca" placeholder="Pesquisar pedido bipado" aria-label="Pesquisar pedido bipado" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="bx" aria-label="Limpar pesquisa">×</button>
  </div>
  <div id="lh"></div>
  <ul id="list"></ul>
</div>

<div class="row">
  <button id="btnCopy">Copiar lista</button>
  <button id="btnNew">Nova carga</button>
</div>
</main>

<script>
(function(){
  var KEY='conf-carga-v1',items=[],last={c:'',t:0},gaps=[],lastKey=0,idle=null;
  var $=function(i){return document.getElementById(i)};
  var man=$('man');

  function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){items=s.items||[];$('carga').value=s.carga||''}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items,carga:$('carga').value}))}catch(e){}}
  function normalize(raw){
    var t=String(raw).trim();
    try{var j=JSON.parse(t);if(j&&j.id)return String(j.id)}catch(e){}
    return t;
  }
  function beep(ok){
    try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
      o.type='square';o.frequency.value=ok?1000:220;g.gain.value=.15;o.connect(g);g.connect(a.destination);
      o.start();o.stop(a.currentTime+(ok?.12:.4))}catch(e){}
    if(navigator.vibrate)navigator.vibrate(ok?60:[120,60,120]);
  }
  function say(t,c){var m=$('msg');m.textContent=t;m.className=c||''}
  function flash(ok){var e=$('cntcard');e.style.outline='6px solid '+(ok?'#1b8a4b':'#d32f2f');setTimeout(function(){e.style.outline=''},500)}
  function render(){
    $('cnt').textContent=items.length;
    var q=$('busca').value.trim().toLowerCase();
    $('bx').style.display=q?'block':'none';
    var ul=$('list');ul.innerHTML='';
    var res=(q?items.filter(function(it){return it.c.toLowerCase().indexOf(q)>-1}):items).slice().reverse();
    $('lh').textContent=q?(res.length+' de '+items.length+' pedidos encontrados'):(items.length?'Últimos pedidos bipados':'');
    if(!res.length){ul.innerHTML='<li class="empty">'+(q?'Nenhum pedido encontrado.':'Nenhum pedido lido ainda.')+'</li>';return}
    res.slice(0,q?300:100).forEach(function(it){
      var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
      a.textContent=it.c;b.textContent=it.h;li.appendChild(a);li.appendChild(b);ul.appendChild(li);
    });
  }
  function add(raw){
    var c=normalize(raw);if(!c)return;
    var now=Date.now();
    if(c===last.c&&now-last.t<1500){last.t=now;return}
    last={c:c,t:now};
    if(items.some(function(i){return i.c===c})){beep(false);flash(false);say('JÁ LIDO: '+c,'bad');return}
    items.push({c:c,h:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
    save();render();beep(true);flash(true);say('OK: '+c,'ok');
  }
  function commit(){
    var v=man.value;man.value='';gaps=[];lastKey=0;clearTimeout(idle);
    if(v.trim())add(v);
  }
  function focusMan(){man.focus()}

  // Leitor USB = teclado: termina com Enter (ou Tab). Sem terminador, fecha sozinho após uma pausa.
  man.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();commit()}
  });
  man.addEventListener('input',function(){
    var n=Date.now();
    if(n-lastKey>500)gaps=[];
    if(lastKey)gaps.push(n-lastKey);
    lastKey=n;
    say('Lendo: '+man.value);
    clearTimeout(idle);
    idle=setTimeout(function(){
      var fast=gaps.length>=5&&Math.max.apply(null,gaps)<80;
      if(man.value.length>=6&&fast)commit();
    },250);
  });

  // Se o foco se perder, qualquer tecla do leitor devolve o foco ao campo.
  document.addEventListener('keydown',function(e){
    var a=document.activeElement;
    if(a===man||a===$('carga')||a===$('busca')||e.ctrlKey||e.metaKey||e.altKey)return;
    focusMan();
  },true);
  man.addEventListener('blur',function(){setTimeout(function(){var a=document.activeElement;if(!a||a===document.body)focusMan()},150)});
  $('carga').addEventListener('blur',function(){setTimeout(function(){var a=document.activeElement;if(!a||a===document.body)focusMan()},150)});
  $('busca').addEventListener('blur',function(){setTimeout(function(){var a=document.activeElement;if(!a||a===document.body)focusMan()},150)});
  document.addEventListener('click',function(e){if(e.target.id!=='carga'&&e.target.id!=='busca')setTimeout(focusMan,50)});
  window.addEventListener('focus',focusMan);

  // Lupa: filtra enquanto digita; Enter (ou bipar nela) diz se o pedido já foi bipado.
  $('busca').addEventListener('input',render);
  $('busca').addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!=='Tab')return;
    e.preventDefault();
    var v=normalize($('busca').value);if(!v)return;
    $('busca').value=v;render();
    var f=items.filter(function(i){return i.c===v})[0];
    if(f)say('JÁ BIPADO às '+f.h+': '+v,'ok');else say('NÃO bipado: '+v,'bad');
  });
  $('bx').onclick=function(){$('busca').value='';render();focusMan()};
  $('btnAdd').onclick=commit;
  $('btnKb').onclick=function(){
    var off=man.getAttribute('inputmode')==='none';
    man.setAttribute('inputmode',off?'text':'none');man.blur();setTimeout(focusMan,50);
    say(off?'Teclado do celular ativado.':'Teclado oculto. Leitor pronto.');
  };
  $('carga').oninput=save;
  $('btnUndo').onclick=function(){
    var x=items.pop();if(!x){say('Nada para desfazer.');return}
    last={c:'',t:0};save();render();say('Removido: '+x.c);
  };
  $('btnCopy').onclick=function(){
    var txt='Carga: '+($('carga').value||'-')+'\nTotal: '+items.length+'\n\n'+items.map(function(i){return i.c+'\t'+i.h}).join('\n');
    function fb(){var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');say('Lista copiada.','ok')}catch(e){say('Não foi possível copiar.','bad')}document.body.removeChild(t);focusMan()}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){say('Lista copiada.','ok')}).catch(fb);else fb();
  };
  $('btnNew').onclick=function(){
    if(items.length&&!confirm('Zerar a contagem de '+items.length+' pedidos e iniciar nova carga?'))return;
    items=[];$('carga').value='';$('busca').value='';last={c:'',t:0};save();render();say('Nova carga iniciada.');
  };

  load();render();focusMan();
})();
</script>
</body>
</html>
